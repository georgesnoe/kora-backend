name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: kora-backend

jobs:
  # ---------------------------------------------------------------------------
  # Compile, run the test suite against PostgreSQL, and keep the build output.
  # ---------------------------------------------------------------------------
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/postgres
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-test-secret-key-with-at-least-32-bytes
        run: ./mvnw -B -ntp verify

      - name: Verify generated OpenAPI specification
        run: |
          set -euo pipefail
          test -s target/openapi.yaml
          grep -q '^openapi:' target/openapi.yaml
          grep -q '/api/auth/sign-up' target/openapi.yaml
          grep -q '/api/auth/refresh' target/openapi.yaml
          grep -q 'bearerAuth' target/openapi.yaml
          echo "OpenAPI specification generated successfully"

      - name: Upload OpenAPI specification
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: target/openapi.yaml
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build the distroless Alpine image and prove that it serves traffic.
  # ---------------------------------------------------------------------------
  docker:
    name: Build and smoke test image
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:v1.33
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs as non-root and has no shell
        run: |
          set -euo pipefail
          image_user="$(docker image inspect "$IMAGE_NAME:ci" --format '{{.Config.User}}')"
          echo "Configured runtime user: $image_user"
          test "$image_user" = "10001:10001"
          if docker run --rm --entrypoint /bin/sh "$IMAGE_NAME:ci" -c true 2>/dev/null; then
            echo "Unexpected shell found in the runtime image" >&2
            exit 1
          fi
          echo "No shell in the runtime image (expected for distroless)"

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --name kora-backend --network host \
            -e DB_URL=jdbc:postgresql://localhost:5432/postgres \
            -e DB_USERNAME=postgres \
            -e DB_PASSWORD=postgres \
            -e MAIL_HOST=localhost \
            -e MAIL_PORT=1025 \
            -e JWT_SECRET=ci-smoke-test-secret-key-with-at-least-32-bytes \
            "$IMAGE_NAME:ci"

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is healthy"
              break
            fi
            sleep 2
          done

          if ! curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
            echo "Application did not become healthy in time" >&2
            docker logs kora-backend >&2
            exit 1
          fi

          echo "Checking generated OpenAPI documentation"
          curl -fsS http://localhost:8080/v3/api-docs.yaml | grep -q '^openapi:'

          echo "Checking that protected endpoints reject unauthenticated requests"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            http://localhost:8080/api/auth/me)"
          echo "GET /api/auth/me without a token -> $status"
          test "$status" = "401"

          for path in refresh sign-out resend-verification; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST "http://localhost:8080/api/auth/$path" \
              -H 'Content-Type: application/json' \
              -d '{}')"
            echo "POST /api/auth/$path without a token -> $status"
            test "$status" = "401"
          done

          echo "Authentication and documentation smoke tests passed"

      - name: Dump container logs
        if: always()
        run: docker logs kora-backend || true

      - name: Stop container
        if: always()
        run: docker rm -f kora-backend || true

  # ---------------------------------------------------------------------------
  # Publish to GitHub Container Registry on main and version tags.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs:
      - test
      - docker
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
