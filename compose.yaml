services:
  postgres:
    image: postgres:17-alpine
    container_name: kora-postgres
    environment:
      POSTGRES_DB: kora
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: kora
    ports:
      - "5432:5432"
    volumes:
      - kora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora -d kora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kora-postgres-data:
