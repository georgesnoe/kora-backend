spring:
  application:
    name: Kora

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    secret: ${JWT_SECRET:kora-development-secret-key-change-me-in-production-0123456789}
    issuer: ${JWT_ISSUER:kora}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}

  verification:
    code-length: ${VERIFICATION_CODE_LENGTH:6}
    ttl: ${VERIFICATION_TTL:PT24H}
    verify-url: ${VERIFICATION_URL:http://localhost:8080/api/auth/verify}

  mail:
    from: ${MAIL_FROM:no-reply@kora.local}
    from-name: ${MAIL_FROM_NAME:Kora}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  paths-to-match:
    - /api/**
