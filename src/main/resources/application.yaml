spring:
  application:
    name: Kora

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kora}
    username: ${DB_USERNAME:kora}
    password: ${DB_PASSWORD:kora}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
